name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust-and-javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js-build

      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build and enforce compressed size
        run: tools/build-js.sh

      - name: Test Node, declarations, and golden parity
        working-directory: packages/anarcism
        run: |
          npm test
          npm run test:types
          npm run parity

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true

      - name: Test Chrome
        working-directory: packages/anarcism
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser

      - name: Inspect package contents
        working-directory: packages/anarcism
        run: npm pack --dry-run

      - name: Type-check and build the demo
        working-directory: demo
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: anarcism-js
          path: packages/anarcism/dist
          if-no-files-found: error

      # Pages deploys this build after CI succeeds on main.
      - uses: actions/upload-artifact@v7
        with:
          name: anarcism-demo
          path: demo/dist
          if-no-files-found: error

  python-wheels:
    name: Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            test: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            test: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            test: false
          - runner: macos-14
            target: universal2-apple-darwin
            manylinux: auto
            test: true
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            test: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: true

      - name: Confirm one abi3 wheel was produced
        shell: bash
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          ls dist/*.whl | grep -- '-abi3-'

      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist anarcism
          python -m pytest python/tests -q

      - uses: actions/upload-artifact@v7
        with:
          name: anarcism-wheel-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Build and test from the sdist alone
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-binary :all: dist/*.tar.gz
          python -m pytest python/tests -q

      - uses: actions/upload-artifact@v7
        with:
          name: anarcism-sdist
          path: dist
          if-no-files-found: error
