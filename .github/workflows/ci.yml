name: CI

on:
  # Only `main` on push. A branch with an open pull request is already covered
  # by the `pull_request` trigger, and filtering here stops every such push
  # from running the whole matrix twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are never reused across CI runs and only inflate what
  # the cache has to carry.
  CARGO_INCREMENTAL: 0
  # `docs/build-release.md` pins this; `wasm-opt` output is not stable across
  # Binaryen versions, so the size gate is only meaningful when it matches.
  BINARYEN_VERSION: 132

jobs:
  rust-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `rust-toolchain.toml` already pins the channel, components, target, and
      # profile. Passing no arguments installs exactly that, so the pin is not
      # restated here and cannot drift. Deliberately not using a setup action
      # that exports RUSTFLAGS: that variable overrides
      # `target.*.rustflags` in `.cargo/config.toml` outright, which would drop
      # `-C target-feature=+simd128` from the WASM build.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - name: Install Binaryen ${{ env.BINARYEN_VERSION }}
        run: |
          version="${BINARYEN_VERSION}"
          curl -fsSL --retry 3 \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz" \
            | tar xz -C /opt
          echo "/opt/binaryen-version_${version}/bin" >> "$GITHUB_PATH"

      - name: Confirm the pinned Binaryen is active
        run: |
          wasm-opt --version
          wasm-opt --version | grep -qw "${BINARYEN_VERSION}"

      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Install browser development dependencies
        working-directory: browser
        run: npm ci

      - name: Build and enforce compressed size
        run: tools/build-browser.sh

      - name: Test Node, declarations, and golden parity
        working-directory: browser
        run: |
          npm test
          npm run test:types
          npm run parity

      - name: Resolve the pinned Playwright version
        id: playwright
        working-directory: browser
        run: |
          version="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browser binaries live in the cached directory, but the system
      # libraries they link against do not, so those are installed either way.
      - name: Install browser runtimes
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: browser
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: browser
        run: npx playwright install-deps

      - name: Test Chromium, Firefox, and WebKit
        working-directory: browser
        run: npm run test:browsers

      - name: Inspect package contents
        working-directory: browser
        run: npm pack --dry-run

      - uses: actions/upload-artifact@v7
        with:
          name: anarcism-browser
          path: browser/dist
          if-no-files-found: error

  python-wheels:
    name: Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            test: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            test: true
          # A musllinux wheel cannot be installed on the glibc runner that built
          # it, so this row is build-only.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            test: false
          # One arm64 runner builds both macOS architectures into a single
          # universal2 wheel, and still runs the suite against its native slice.
          - runner: macos-14
            target: universal2-apple-darwin
            manylinux: auto
            test: true
          # Cross compiled from Linux with cargo-xwin, which drops the
          # higher-billed Windows runner. `manylinux: off` keeps the build out
          # of the manylinux container, which has no cargo-xwin toolchain.
          # Build-only: a Windows wheel cannot be executed on a Linux host.
          - runner: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            test: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # maturin-action carries its own sccache, so `Swatinem/rust-cache` is
      # deliberately absent from this job rather than stacked on top of it.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # No `--release`: it overrides `[tool.maturin] profile = "python"` and
          # would ship the browser profile's aborting panics.
          args: --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: true

      - name: Confirm one abi3 wheel was produced
        shell: bash
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          ls dist/*.whl | grep -- '-abi3-'

      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist anarcism
          python -m pytest python/tests -q

      - uses: actions/upload-artifact@v7
        with:
          name: anarcism-wheel-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Guards the one setting that cannot be checked from a built artifact: an
      # aborting panic would kill the host interpreter instead of raising.
      - name: The python profile must keep unwinding
        run: |
          python - <<'EOF'
          import re, tomllib
          manifest = tomllib.loads(open("Cargo.toml").read())
          profile = manifest["profile"]["python"]
          assert profile["panic"] == "unwind", profile
          assert profile["inherits"] == "release", profile
          config = open("pyproject.toml").read()
          assert re.search(r'^profile = "python"$', config, re.M), "maturin profile not set"
          EOF

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Build and test from the sdist alone
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-binary :all: dist/*.tar.gz
          python -m pytest python/tests -q

      - uses: actions/upload-artifact@v7
        with:
          name: anarcism-sdist
          path: dist
          if-no-files-found: error
