name: Database update check

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-update-check
  cancel-in-progress: true

jobs:
  imgt-genedb:
    name: Check IMGT/GENE-DB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compare the live database with the pinned snapshot
        run: python tools/check_imgt_update.py
