name: Pages

# Deploys the demo that CI built, so Pages never rebuilds the package.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Select the CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Manual runs redeploy the latest successful CI build of main.
          run_id="${EVENT_RUN_ID}"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: anarcism-demo
          path: demo-dist
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
