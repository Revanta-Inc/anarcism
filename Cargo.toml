[workspace]
members = [
	"crates/anarcism-core",
	"crates/anarcism-modelgen",
	"crates/anarcism-python",
	"crates/anarcism-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Moritz Onken <mo@revanta.bio>"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/revanta/anarcism"

[workspace.dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
wide = { version = "1.6.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Optimize compute-heavy tests without disabling debug or overflow checks.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true
opt-level = 3

[profile.benchmark]
inherits = "release"
opt-level = 3

# PyO3 needs unwinding to convert Rust panics into Python exceptions.
[profile.python]
inherits = "release"
opt-level = 3
panic = "unwind"
