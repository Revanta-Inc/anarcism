<!doctype html>
<meta charset="utf-8" />
<title>anarcism browser test</title>
<script type="module">
	import { Anarcism } from "/index.js";
	import * as workerPool from "/worker-pool.js";
	globalThis.Anarcism = Anarcism;
	globalThis.anarcismWorkerPool = workerPool;
	globalThis.anarcismStage = "initializing";
	const initializationStarted = performance.now();
	globalThis.anarcismReady = Anarcism.create({ source: "/anarcism.wasm" }).then(
		(value) => {
			globalThis.anarcismApi = value;
			globalThis.anarcismInitializationMs = performance.now() - initializationStarted;
			globalThis.anarcismStage = "ready";
			return value;
		},
		(error) => {
			globalThis.anarcismStage = `error: ${error}`;
			throw error;
		},
	);
</script>
