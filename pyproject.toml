[project]
name = "anarcism"
version = "0.1.0"
description = "ANARCI-compatible IMGT numbering for antibody and TCR variable domains, with no external dependencies."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Moritz Onken", email = "mo@revanta.bio" }]
license = "LicenseRef-Proprietary"
license-files = ["THIRD_PARTY_NOTICES.md"]
keywords = ["antibody", "tcr", "imgt", "numbering", "anarci", "bioinformatics"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Programming Language :: Rust",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
	"Typing :: Typed",
]
dependencies = []

[project.scripts]
anarcism = "anarcism.cli:main"

[project.urls]
Repository = "https://github.com/revanta/anarcism"

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/anarcism-python/Cargo.toml"
module-name = "anarcism._anarcism"
python-source = "python"
features = ["pyo3/extension-module"]
profile = "python"
include = [
	{ path = ".cargo/config.toml", format = "sdist" },
	{ path = "assets/**/*", format = "sdist" },
	{ path = "THIRD_PARTY_NOTICES.md", format = "sdist" },
]

[dependency-groups]
# The pinned native ANARCI/HMMER reference. It generates the golden corpora and
# backs the parity and comparison benchmarks; it is never a runtime dependency
# of the published wheel. Install it alone, without building the extension:
#   uv sync --locked --no-install-project --no-default-groups --group reference
reference = ["anarci==2026.2.13.2"]
dev = ["maturin>=1.9,<2.0", "pytest>=8.4.2"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
